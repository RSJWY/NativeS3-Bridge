      handler（text/event-stream、no-store、X-Accel-Buffering: no、15s 具名 heartbeat
      事件、retry 提示）；transport.go 在 Hub.Register/setOnline 后发布
      node_online、disconnect 实际离线分支发布 node_offline、handleTaskResult 落库成功后发布
      task_updated；tasks.go 在 Dispatch(pending/running/两处 failed
      回滚)、expireTask(failed)、FailInFlightForConn(unknown) 发布
      task_updated；adminserver.go 挂载路由到现有 webadmin 会话中间件并更新超时注释（SSE 依赖不设
      WriteTimeout）；cmd/panel/main.go 创建共享总线接线 transport/tasks/admin。前端：新增
      composables/useAdminEvents.ts（模块级单例 EventSource + 引用计数、心跳判活、45s 无帧降级 30s
      轮询、重连后 onReconnect 重拉补齐、401 走既有 markLoggedOut
      路径）；PanelNodes/PanelDashboard 订阅节点事件静默重拉；PanelNodeDetail
      订阅本节点上下线重拉运行状态；PanelNodeLogsSection 任务进度由 800ms 固定轮询改为 task_updated 事件驱动 +
      5s 兜底 + 70s deadline。文档：docs/public-deployment.md 新增 SSE 章节与 nginx
      /api/admin/events location 示例（proxy_buffering off、read_timeout 300s）。验收
      A1-A7 全部实现并附证据。"
    truncated: false
