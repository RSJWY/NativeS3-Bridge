acceptance:
  - id: A1
    source: brief.md
    text: "Scenario: 管理员登录面板后停留在 PanelNodes
      页面，一个节点进程随后启动并注册成功，页面在线状态在数秒内自动变为在线，全程无手动刷新。"
    result: passed
    reason:
      text: transport.go serve() 在 Hub.Register/setOnline(true) 落库后发布
        node_online；PanelNodes.vue 经 useAdminEvents 订阅 node_online/node_offline
        后静默重拉 listNodes，无手动刷新。TestTaskStateTransitionsPublishEvents（真实节点注册路径）与
        TestAdminEventsHandlerStreamsEvents 均通过。
      truncated: false
  - id: A2
    source: brief.md
    text: "Scenario: 管理员停留在 PanelDashboard 总览页，节点下线后总览的节点统计自动更新。"
    result: passed
    reason:
      text: transport.go disconnect() 在 Hub.Unregister 且 !IsOnline 分支 setOnline(false)
        后发布 node_offline（顶替连接不误发）；PanelDashboard.vue 订阅节点事件后静默重拉
        panelDashboardSummary。事件发布先于 REST 可见状态变化语义由发布点位于落库之后保证。
      truncated: false
  - id: A3
    source: brief.md
    text: "Scenario: 管理员在 PanelNodeDetail
      触发导入任务并停留在任务进度区，任务状态（pending/running/success/failed/unknown）变化自动呈现，不再依赖固定
      800ms 轮询。"
    result: passed
    reason:
      text: tasks.go Dispatch 发布 pending/running 及两处 failed 回滚、expireTask 发布
        failed、FailInFlightForConn 发布 unknown，transport.go handleTaskResult 发布
        success/failed，五种状态全覆盖；PanelNodeLogsSection.vue 原 800ms setTimeout
        轮询已删除，改为按 task_id 匹配 activeTaskID 的 task_updated 事件驱动 fetchTask，附 5s
        兜底定时器与 70s deadline。TestTaskStateTransitionsPublishEvents 断言
        pending→running→success 按序发布，通过。
      truncated: false
  - id: A4
    source: brief.md
    text: "Scenario: 未携带会话 Cookie 请求 `GET /api/admin/events`，服务端返回 401，不建立事件流。"
    result: passed
    reason:
      text: adminapi.go Routes 将 /api/admin/events 与其他 REST 同样置于调用方传入的鉴权 wrap
        内（adminserver.go 传
        authenticator.Middleware）；TestAdminEventsRouteRequiresSession 用真实
        webadmin 中间件断言未携带会话返回 401 且 Content-Type 非 text/event-stream（不建立流），通过。
      truncated: false
  - id: A5
    source: brief.md
    text: "Scenario: SSE 连接中断后，前端自动重连并在恢复后补齐期间错过的状态变化（通过重拉 REST 数据）。"
    result: passed
    reason:
      text: "useAdminEvents.ts：CONNECTING 态交给 EventSource 内建重连（服务端 retry: 5000 提示），致命
        CLOSED 后 15s 手动重连；onopen 且 everOpened 时对所有订阅者触发
        onReconnect，PanelNodes/PanelDashboard/PanelNodeDetail 的 reload 重拉 REST
        补齐断连期间错过的变化。实现审查 + vue-tsc/build 通过证实。"
      truncated: false
  - id: A6
    source: brief.md
    text: "Scenario: SSE 持续不可用（如反代缓冲导致连上但无事件到达）时，前端在心跳超时后自动降级为慢速定时轮询，页面数据仍能自动更新；SSE
      恢复后轮询停止。"
    result: passed
    reason:
      text: events.go 每 15s 发具名 heartbeat 事件（TestAdminEventsHandlerStreamsEvents
        断言心跳帧到达，通过）；useAdminEvents.ts 看门狗每 5s 检查，45s 无任何帧即 degrade()：立即 reload
        并启动 30s 慢速轮询，任意帧到达 noteReceived→undegrade
        停止轮询，降级期间加入的订阅者也纳入轮询。心跳周期显著小于降级阈值，语义匹配。
      truncated: false
  - id: A7
    source: brief.md
    text: "Scenario: `go vet ./...` 与 `go test ./...`（至少覆盖
      pkg/panel、pkg/webadmin）通过；pkg/webadmin/ui `npm run build`（vue-tsc + vite
      build）通过。"
    result: passed
    reason:
      text: 独立重跑：go vet ./... 退出码 0；go test ./... 18 包全部 ok（含
        pkg/panel、pkg/webadmin）；定向 go test ./pkg/panel/ -run
        'TestAdminEvent|TestAdminEvents|TestTaskStateTransitions' -v 8 个用例全部
        PASS；pkg/webadmin/ui npm run build（vue-tsc --noEmit && vite build）退出码 0。
      truncated: false
